[package]
name = "multi-row-tab-bar"
version = "0.1.0"
edition = "2021"
description = "A zellij tab-bar plugin that wraps tabs across multiple rows"
license = "MIT"

[dependencies]
# Pinned to match the installed zellij host (0.44.0) exactly — a newer plugin
# on an older host can hit plugin-protocol ABI mismatches.
zellij-tile = "=0.44.0"
zellij-tile-utils = "=0.44.0"
ansi_term = "0.12"
unicode-width = "0.1"

[profile.release]
# zellij 0.44 runs plugins in an interpreter (wasmi), where size-optimized code
# is noticeably slower; every tab's instance handles every event, so optimize
# for speed. Costs ~400 KB of wasm.
lto = true
opt-level = 3
strip = true
